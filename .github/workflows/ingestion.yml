name: Daily Job Ingestion
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ingestion-group
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Dependencies
        run: uv sync --frozen
      - name: Run API Ingestion
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: uv run python ingest_api.py
      - name: Run Scraper Ingestion
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: uv run python ingest_scrapper.py
      - name: Deduplicate Jobs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: uv run python pipeline/dedupe_jobs.py
