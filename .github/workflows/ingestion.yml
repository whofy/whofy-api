name: Weekly Job Ingestion
on:
  # Weekly (Mondays 00:00 UTC) rather than daily, to go easier on the sites we
  # scrape. Safe with RETENTION_DAYS = 14: a live posting is re-seen every 7
  # days, so it only ages out if its source fails two runs in a row.
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ingestion-group
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Dependencies
        run: uv sync --frozen
      - name: Run API Ingestion
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: uv run python ingest_api.py
      # API ingestion exits 1 if any single source failed, which used to abort
      # the job here — so one flaky board meant the scrapers never ran and
      # nothing was deduplicated that day. These steps are independent of that
      # outcome, so they run anyway; the job is still marked red by the failing
      # step above. `!cancelled()` (rather than `always()`) so a manually
      # cancelled run still stops.
      - name: Run Scraper Ingestion
        if: ${{ !cancelled() }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: uv run python ingest_scrapper.py
      - name: Deduplicate Jobs
        if: ${{ !cancelled() }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: uv run python pipeline/dedupe_jobs.py
