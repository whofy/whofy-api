[project]
name = "whofy-api"
version = "0.1.0"
description = "FastAPI backend for Whofy — resume-upload → job-matching."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pymongo==4.7.2",
    "motor==3.4.0",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.9",
    "requests==2.32.3",
    "certifi==2026.6.17",
    "httpx==0.27.2",
    "PyJWT[crypto]==2.8.0",
    "pymupdf==1.28.0",
    "python-docx==1.1.2",
    "beautifulsoup4==4.12.3",
    "groq==0.9.0",
    "langdetect==1.0.9",
    "slowapi==0.1.10",
    "pyyaml==6.0.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "mongomock==4.3.0",
    "mongomock-motor==0.0.34",
    "responses==0.25.3",
]

[tool.uv]
package = false
